name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Los scripts usan COM (Excel/Word/Outlook) y DPAPI: sólo corren en Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Las mismas versiones que usan las tareas programadas.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pyflakes NTT GCI
      - run: python -m pytest
